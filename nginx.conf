# OpenResty reverse proxy — routes flagged IPs to the decoy.
# Contract with the detector: key  flag:<client-ip>  exists in Redis  => decoy.
# Set it with:  SET flag:<ip> <detection-unix-ts> EX 600   (value is free; proxy only checks the key exists)
worker_processes auto;
env REDIS_HOST;
env REDIS_PORT;

events { worker_connections 1024; }

http {
    # Needed for Lua (cosocket) DNS lookups of REDIS_HOST. "local=on" reads /etc/resolv.conf,
    # so the same file works in docker compose and in k8s (use the FQDN for REDIS_HOST there).
    resolver local=on ipv6=off valid=30s;

    # Send "Connection: upgrade" only when the client asked for a websocket upgrade.
    map $http_upgrade $connection_upgrade { default upgrade; "" ""; }

    # Real and decoy backends. Names resolved once at startup (k8s Service ClusterIPs are stable).
    upstream grafana_real  { server grafana:3000; }
    upstream grafana_decoy { server grafana-decoy:3000; }

    # JSON access log: Omar's dummy detector can count req/min per IP from this.
    log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                                '"uri":"$request_uri","status":$status,"route":"$route",'
                                '"bytes":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    server {
        listen 8080;

        location = /healthz { access_log off; return 200 "ok\n"; }

        location / {
            set $route "grafana_real";

            access_by_lua_block {
                local redis = require "resty.redis"
                local red = redis:new()
                red:set_timeouts(100, 100, 100)   -- ms; never slow down normal users

                local host = os.getenv("REDIS_HOST") or "redis"
                local port = tonumber(os.getenv("REDIS_PORT") or "6379")
                local ok, err = red:connect(host, port)
                if not ok then
                    -- FAIL OPEN: Redis down => everyone goes to the real Grafana.
                    ngx.log(ngx.ERR, "redis connect failed: ", err)
                    return
                end

                local res, err = red:exists("flag:" .. ngx.var.remote_addr)
                red:set_keepalive(10000, 100)
                if res == 1 then
                    ngx.var.route = "grafana_decoy"
                elseif not res then
                    ngx.log(ngx.ERR, "redis exists failed: ", err)
                end
            }

            proxy_pass http://$route;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;      # Grafana live/websocket
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
